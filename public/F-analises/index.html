<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Flocken dashboard</title>
  <!-- Lösenordsrutan är borttagen (2026-10-18): lösenordet stod i sidans kod
       och skyddade ingenting. Dashboarderna kräver inloggning med ett konto
       som står i dashboard_admins i respektive databas. -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      max-width: 320px;
      width: 100%;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1rem 0; color: #2d5a27; }
    a.knapp {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 1rem;
      padding: 0.65rem;
      background: #2d5a27;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
    }
    a.knapp:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Flocken dashboard</h1>
    <p style="color:#6c757d; font-size:0.9rem; margin:0 0 1rem 0;">Välj region. Du loggar in med ditt Flocken-konto på dashboarden.</p>
    <a class="knapp" href="flocken-veckodashboard.html">Öppna dashboard (Europa)</a>
    <a class="knapp" href="flocken-veckodashboard-brasilien.html">Öppna dashboard (Brasilien)</a>
  </div>
</body>
</html>
