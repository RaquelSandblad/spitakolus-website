<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in – Finans</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; margin: 0; padding: 2rem; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #e7ecf1; }
    .box { background: #1a2332; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.4); max-width: 360px; width: 100%; border: 1px solid #2a3544; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem 0; color: #6ee7b7; }
    p { color: #94a3b8; font-size: 0.9rem; margin: 0 0 1rem 0; }
    label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.35rem; }
    input[type="password"] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: #0f1419; color: #e7ecf1; }
    button { width: 100%; margin-top: 1rem; padding: 0.65rem; background: #059669; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #047857; }
    .error { color: #f87171; font-size: 0.9rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Finans – Aktieanalys</h1>
    <p>Privat dashboard för watchlist, signaler och nyheter. Endast för dig.</p>
    <form id="form">
      <label for="pw">Lösenord</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Lösenord">
      <button type="submit">Öppna dashboard</button>
    </form>
    <p id="err" class="error" style="display:none;">Fel lösenord. Försök igen.</p>
  </div>
  <script>
    (function() {
      var RATT_LOSENORD = 'Mingau';
      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        var err = document.getElementById('err');
        err.style.display = 'none';
        if (document.getElementById('pw').value === RATT_LOSENORD) {
          sessionStorage.setItem('finans_dashboard_ok', '1');
          location.href = 'dashboard.html';
        } else {
          err.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
