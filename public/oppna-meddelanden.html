<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öppna meddelanden – Flocken</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f8f9fa; color:#2d3748; margin:0; padding:24px; }
    .card { max-width:480px; margin:40px auto; background:#fff; border-radius:12px; padding:32px 24px; box-shadow:0 4px 12px rgba(0,0,0,.08); text-align:center; }
    h1 { font-size:1.5rem; margin:0 0 12px; color:#6B7A3A; }
    p { line-height:1.6; color:#4a5568; }
    .btn { display:inline-block; margin:16px 8px 8px; padding:14px 22px; border-radius:10px; text-decoration:none; font-weight:600; }
    .primary { background:#6B7A3A; color:#fff; }
    .stores { margin-top:24px; font-size:.95rem; }
    .stores a { color:#6B7A3A; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Flocken</h1>
    <p>Vi försöker öppna appen på Meddelanden …</p>
    <p id="status">Om inget händer, tryck på knappen nedan.</p>
    <a class="btn primary" href="flocken://meddelanden" id="openApp">Öppna i appen</a>
    <div class="stores">
      <p>Har du tagit bort appen?</p>
      <a href="https://apps.apple.com/se/app/flocken/id6755424578">App Store (iPhone)</a>
      &nbsp;&middot;&nbsp;
      <a href="https://play.google.com/store/apps/details?id=com.bastavan.app">Google Play (Android)</a>
      &nbsp;&middot;&nbsp;
      <a href="https://flocken.info">flocken.info</a>
    </div>
  </div>
  <script>
    (function () {
      var scheme = 'flocken://meddelanden';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;
      var start = Date.now();
      window.location.href = scheme;
      setTimeout(function () {
        if (Date.now() - start < 1800) {
          document.getElementById('status').textContent =
            'Appen öppnades inte automatiskt. Tryck på knappen eller ladda ner appen igen.';
        }
      }, 1500);
    })();
  </script>
</body>
</html>
