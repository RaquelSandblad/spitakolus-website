<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c88cff"/>
      <stop offset="1" stop-color="#7738b8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e1b6ff"/>
      <stop offset="1" stop-color="#a35de0"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9bd"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#40205f" flood-opacity=".20"/>
    </filter>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft cave-light beam -->
  <path d="M302 193 L493 116 Q510 190 493 265 L302 221Z" fill="url(#beam)"/>
  <!-- feet -->
  <g fill="none" stroke="#48235f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 303 L113 332 L91 328"/><path d="M148 338 L112 375 L91 375"/><path d="M164 370 L140 413 L120 418"/>
    <path d="M310 303 L354 332 L376 328"/><path d="M318 338 L355 375 L376 375"/><path d="M302 370 L327 413 L347 418"/>
  </g>
  <g fill="#ffd77a" stroke="#48235f" stroke-width="6">
    <ellipse cx="88" cy="328" rx="12" ry="8"/><ellipse cx="88" cy="375" rx="12" ry="8"/><ellipse cx="117" cy="419" rx="12" ry="8"/>
    <ellipse cx="379" cy="328" rx="12" ry="8"/><ellipse cx="379" cy="375" rx="12" ry="8"/><ellipse cx="350" cy="419" rx="12" ry="8"/>
  </g>
  <!-- antennae -->
  <g fill="none" stroke="#48235f" stroke-width="9" stroke-linecap="round">
    <path d="M207 143 Q185 108 166 103"/><path d="M282 143 Q302 108 322 103"/>
  </g>
  <g fill="#ffc857" stroke="#48235f" stroke-width="6"><circle cx="163" cy="101" r="11"/><circle cx="325" cy="101" r="11"/></g>
  <g filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="234" cy="316" rx="104" ry="119" fill="url(#body)" stroke="#48235f" stroke-width="9"/>
    <path d="M234 203 C178 207 142 258 142 316 C142 373 179 422 234 432Z" fill="url(#shell)" stroke="#48235f" stroke-width="9"/>
    <path d="M234 203 C290 207 326 258 326 316 C326 373 289 422 234 432Z" fill="url(#shell)" stroke="#48235f" stroke-width="9"/>
    <path d="M234 207 L234 428" stroke="#48235f" stroke-width="7"/>
    <!-- shell shine -->
    <path d="M176 262 Q188 233 211 225" fill="none" stroke="#efd7ff" stroke-width="12" stroke-linecap="round" opacity=".8"/>
    <path d="M286 245 Q302 262 307 285" fill="none" stroke="#efd7ff" stroke-width="9" stroke-linecap="round" opacity=".58"/>
    <!-- head -->
    <ellipse cx="234" cy="190" rx="83" ry="68" fill="url(#body)" stroke="#48235f" stroke-width="9"/>
    <!-- cheeks -->
    <ellipse cx="181" cy="203" rx="14" ry="8" fill="#f18bba" opacity=".75"/>
    <ellipse cx="287" cy="203" rx="14" ry="8" fill="#f18bba" opacity=".75"/>
    <!-- eyes -->
    <ellipse cx="204" cy="181" rx="8" ry="13" fill="#38234d"/>
    <ellipse cx="264" cy="181" rx="8" ry="13" fill="#38234d"/>
    <circle cx="206" cy="177" r="3" fill="#fff"/><circle cx="266" cy="177" r="3" fill="#fff"/>
    <!-- tiny smile -->
    <path d="M221 211 Q234 221 247 211" fill="none" stroke="#623b70" stroke-width="5" stroke-linecap="round"/>
    <!-- headlamp strap -->
    <path d="M157 166 Q234 128 311 166" fill="none" stroke="#48235f" stroke-width="12" stroke-linecap="round"/>
    <path d="M157 165 Q234 132 311 165" fill="none" stroke="#ffcf67" stroke-width="6" stroke-linecap="round"/>
    <!-- headlamp -->
    <rect x="211" y="119" width="47" height="37" rx="12" fill="#7544a0" stroke="#48235f" stroke-width="7"/>
    <rect x="219" y="126" width="31" height="23" rx="8" fill="url(#lamp)" stroke="#fff4c2" stroke-width="3"/>
    <circle cx="234" cy="137" r="5" fill="#fffef0"/>
  </g>
  <!-- little dirt flecks -->
  <g fill="#9a673e" opacity=".8"><circle cx="101" cy="257" r="7"/><circle cx="399" cy="232" r="6"/><circle cx="385" cy="449" r="8"/><circle cx="78" cy="452" r="5"/></g>
  <!-- ground shadow -->
  <ellipse cx="234" cy="454" rx="139" ry="17" fill="#40205f" opacity=".12"/>
</svg>
